<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>LVL UP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--acc:#4f8cff;--acc-t12:rgba(79,140,255,.12);--acc-t22:rgba(79,140,255,.22);--acc-t45:rgba(79,140,255,.45);--acc-glow:rgba(79,140,255,.85);--acc-text:#a9c6ff;--acc-deep:#3a72e0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#08080a;color:#e9ecf2;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;height:100%;overflow:hidden;user-select:none}
button,input{font-family:inherit;color:inherit}
input::placeholder{color:#565f70}
::selection{background:var(--acc-t45)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#242a35;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#313a4a}
@keyframes toastIn{from{transform:translateY(22px) scale(.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes popIn{from{transform:scale(.965) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes conf{from{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:1}to{transform:translate3d(0,105vh,0) rotate(720deg);opacity:0}}
.qrow{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.qrow:hover{transform:translateX(3px)}
.qrow:hover .q-del{opacity:1 !important}
[data-hk]{cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";
const MS = 86400000;
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const WD_FULL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const RANKS = [[1,'Новичок'],[3,'Искатель'],[5,'Воин'],[8,'Мастер'],[12,'Легенда'],[16,'Титан']];
const XP_OPTS = [[10,'легко'],[20,'норма'],[35,'сложно'],[50,'эпик']];
const CATS = {
  body: { name: 'Тело', icon: '💪', color: '#4f8cff' },
  mind: { name: 'Разум', icon: '🧠', color: '#a78bfa' },
  work: { name: 'Работа', icon: '⚙️', color: '#34d399' },
  life: { name: 'Быт', icon: '🏠', color: '#ffc247' }
};
const CAT_ORDER = ['body', 'mind', 'work', 'life'];
const tint = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const key = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const rankFor = lvl => { let r = RANKS[0][1]; for (const [n, name] of RANKS) if (lvl >= n) r = name; return r; };
const needFor = lvl => 100 + (lvl - 1) * 50;

const STORE_KEY = 'lvlup_state_v3';
const DEFAULT_QUESTS = [
  { id: 1, title: 'Пробежка 5 км', xp: 35, type: 'daily', cat: 'body' },
  { id: 2, title: 'Чтение — 20 страниц', xp: 20, type: 'daily', cat: 'mind' },
  { id: 3, title: 'Медитация 10 минут', xp: 10, type: 'daily', cat: 'mind' },
  { id: 4, title: 'Тренировка в зале', xp: 50, type: 'weekdays', days: [1, 3, 5], cat: 'body' },
  { id: 5, title: 'Английский — один урок', xp: 20, type: 'weekdays', days: [2, 4, 6], cat: 'mind' },
  { id: 6, title: 'Холодный душ', xp: 10, type: 'daily', cat: 'body' },
  { id: 7, title: 'Разобрать входящие', xp: 20, type: 'everyN', n: 3, start: key(new Date()), cat: 'work' },
  { id: 8, title: 'Глубокая работа — 2 часа', xp: 35, type: 'weekdays', days: [1, 2, 3, 4, 5], cat: 'work' },
  { id: 9, title: 'Порядок на столе', xp: 10, type: 'daily', cat: 'life' },
  { id: 10, title: 'План на завтра', xp: 10, type: 'daily', cat: 'life' },
  { id: 11, title: 'Готовка на два дня', xp: 20, type: 'everyN', n: 2, start: key(new Date()), cat: 'life' }
];

function loadPersisted(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !Array.isArray(s.quests)) return null;
    return s;
  }catch(e){ return null; }
}

class App {
  constructor(){
    const persisted = loadPersisted();
    const today = new Date();
    this.state = {
      quests: persisted ? persisted.quests : DEFAULT_QUESTS.slice(),
      done: persisted ? persisted.done : {},
      nextId: persisted ? persisted.nextId : 12,
      accent: (persisted && persisted.accent) || 'blue',
      today,
      screen: 'today',
      month: new Date(today.getFullYear(), today.getMonth(), 1),
      showNew: false, dayKey: null,
      formTitle: '', formXp: 20, formRepeat: 'daily', formDays: [1, 3, 5], formN: 2, formCat: 'body',
      toasts: [], confetti: [], seq: 0
    };
    this.root = document.getElementById('root');
    this._handlers = [];
    this._formTitle = '';
    this.root.addEventListener('click', e => {
      const el = e.target.closest('[data-hk]');
      if(el){ const fn = this._handlers[+el.dataset.hk]; if(fn) fn(e); }
    });
    this.applyAccent();
    this.render();
  }

  persist(){
    const { quests, done, nextId, accent } = this.state;
    localStorage.setItem(STORE_KEY, JSON.stringify({ quests, done, nextId, accent }));
  }

  setState(patch, cb){
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    this.render();
    if(cb) cb();
  }

  applyAccent(){
    const gold = this.state.accent === 'gold';
    const set = (k, val) => document.documentElement.style.setProperty(k, val);
    if(gold){
      set('--acc', '#ffc247'); set('--acc-t12', 'rgba(255,194,71,.12)'); set('--acc-t22', 'rgba(255,194,71,.22)');
      set('--acc-t45', 'rgba(255,194,71,.45)'); set('--acc-glow', 'rgba(255,194,71,.8)');
      set('--acc-text', '#ffdf9e'); set('--acc-deep', '#e09f1f');
    } else {
      set('--acc', '#4f8cff'); set('--acc-t12', 'rgba(79,140,255,.12)'); set('--acc-t22', 'rgba(79,140,255,.22)');
      set('--acc-t45', 'rgba(79,140,255,.45)'); set('--acc-glow', 'rgba(79,140,255,.85)');
      set('--acc-text', '#a9c6ff'); set('--acc-deep', '#3a72e0');
    }
  }

  scheduled(q, d){
    if (q.type === 'daily') return true;
    if (q.type === 'weekdays') return (q.days || []).includes(d.getDay());
    if (q.type === 'everyN') { const s = new Date(q.start || key(this.state.today)); return Math.round((d - s) / MS) % (q.n || 2) === 0; }
    return q.date === key(d);
  }
  repeatLabel(q){
    if (q.type === 'daily') return 'ежедневно';
    if (q.type === 'weekdays') return 'по дням: ' + (q.days || []).slice().sort().map(i => WD[i]).join(', ');
    if (q.type === 'everyN') return 'каждые ' + (q.n || 2) + ' дн.';
    return 'разово';
  }
  questsOn(d){ return this.state.quests.filter(q => this.scheduled(q, d)); }
  xpOn(k){
    const ids = this.state.done[k] || [];
    return ids.reduce((s, id) => { const q = this.state.quests.find(x => x.id === id); return s + (q ? q.xp : 0); }, 0);
  }
  totalXp(){ return Object.keys(this.state.done).reduce((s, k) => s + this.xpOn(k), 0); }
  levelInfo(){
    let xp = this.totalXp(), lvl = 1;
    while (xp >= needFor(lvl)) { xp -= needFor(lvl); lvl++; }
    return { lvl, cur: xp, need: needFor(lvl) };
  }
  streakInfo(){
    let cur = 0;
    for (let i = 0; i < 400; i++) {
      const k = key(new Date(this.state.today.getTime() - i * MS));
      if ((this.state.done[k] || []).length) cur++; else { if (i > 0) break; }
    }
    let best = 0, run = 0;
    for (let i = 400; i >= 0; i--) {
      const k = key(new Date(this.state.today.getTime() - i * MS));
      if ((this.state.done[k] || []).length) { run++; best = Math.max(best, run); } else run = 0;
    }
    return { cur, best: Math.max(best, cur) };
  }

  toggle(dKey, id){
    const done = { ...this.state.done };
    const list = (done[dKey] || []).slice();
    const q = this.state.quests.find(x => x.id === id);
    const i = list.indexOf(id);
    const before = this.levelInfo().lvl;
    if (i >= 0) list.splice(i, 1); else list.push(id);
    done[dKey] = list;
    this.setState({ done }, () => {
      this.persist();
      if (i >= 0) return;
      const after = this.levelInfo().lvl;
      if (after > before) { this.pushToast('🏆', 'Уровень ' + after + ' — ' + rankFor(after) + '!', 'Новый ранг открыт'); this.burst(); }
      else this.pushToast('⚡', '+' + q.xp + ' XP', q.title);
    });
  }
  pushToast(icon, title, sub){
    const id = this.state.seq + 1;
    this.setState(s => ({ seq: id, toasts: [...s.toasts, { id, icon, title, sub }] }));
    setTimeout(() => this.setState(s => ({ toasts: s.toasts.filter(t => t.id !== id) })), 2600);
  }
  burst(){
    const pieces = Array.from({ length: 70 }, (_, i) => ({
      id: 'c' + Date.now() + i, left: Math.random() * 100, delay: Math.random() * 0.5,
      dur: 1.5 + Math.random() * 1.1, size: 5 + Math.random() * 7,
      color: ['var(--acc)', 'var(--acc-text)', '#ffc247', '#e9ecf2'][i % 4]
    }));
    this.setState({ confetti: pieces });
    setTimeout(() => this.setState({ confetti: [] }), 2800);
  }

  computeVals(){
    const s = this.state;
    const { lvl, cur, need } = this.levelInfo();
    const st = this.streakInfo();
    const tk = key(s.today);
    const doneIds = s.done[tk] || [];
    const list = this.questsOn(s.today);
    const doneToday = list.filter(q => doneIds.includes(q.id)).length;
    const R = 39, circ = 2 * Math.PI * R;
    const rowBase = 'display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid #242a35;background:linear-gradient(165deg,#151820,#101319);';
    const boxBase = 'flex:0 0 26px;width:26px;height:26px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;cursor:pointer;transition:all .18s ease;';
    const xpBase = 'flex:0 0 auto;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:-.01em;';

    const mkRow = (q, dKey, doneList) => {
      const isDone = doneList.includes(q.id);
      const col = (CATS[q.cat] || CATS.body).color;
      const hk = this.reg(() => this.toggle(dKey, q.id));
      const dk2 = this.reg(e => { e.stopPropagation(); this.state.quests = this.state.quests.filter(x => x.id !== q.id); this.persist(); this.render(); });
      return {
        id: q.id, title: q.title, xp: q.xp, repeatLabel: this.repeatLabel(q), tick: isDone ? '✓' : '', hk, dk: dk2,
        rowStyle: rowBase + 'border-left:2px solid ' + tint(col, isDone ? 0.35 : 0.85) + ';' + (isDone ? 'opacity:.6;' : ''),
        boxStyle: boxBase + (isDone
          ? 'background:' + col + ';border:1px solid ' + col + ';color:#0a0c11;box-shadow:0 0 16px -2px ' + tint(col, 0.85) + ';'
          : 'background:transparent;border:1.5px solid ' + tint(col, 0.35) + ';color:transparent;'),
        titleStyle: 'font-size:13.5px;font-weight:700;letter-spacing:-.015em;line-height:1.3;' + (isDone ? 'color:#7c8598;text-decoration:line-through;' : 'color:#e9ecf2;'),
        xpStyle: xpBase + (isDone ? 'background:#1a1f29;color:#6b7488;' : 'background:' + tint(col, 0.13) + ';border:1px solid ' + tint(col, 0.3) + ';color:' + col + ';')
      };
    };

    const navDefs = [['today', 'Сегодня', '◎'], ['calendar', 'Календарь', '▦'], ['stats', 'Статистика', '◧'], ['ach', 'Ачивки', '✦']];
    const navItems = navDefs.map(([id, label, icon]) => ({
      label, icon, hk: this.reg(() => this.setState({ screen: id })),
      style: 'display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:11px;border:1px solid ' + (s.screen === id ? 'var(--acc-t45)' : 'transparent') +
        ';background:' + (s.screen === id ? 'var(--acc-t12)' : 'transparent') + ';color:' + (s.screen === id ? '#e9ecf2' : '#8d97ab') +
        ';font-size:13px;font-weight:700;letter-spacing:-.01em;text-align:left;' +
        (s.screen === id ? 'box-shadow:0 0 22px -12px var(--acc-glow);' : '')
    }));

    const m = s.month;
    const first = new Date(m.getFullYear(), m.getMonth(), 1);
    const lead = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push({ label: '', style: 'min-height:92px;border-radius:13px;border:1px solid transparent;', numStyle: '', dots: [], hk: -1 });
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(m.getFullYear(), m.getMonth(), d);
      const k = key(date);
      const isToday = k === tk;
      const future = date > s.today;
      const dl = s.done[k] || [];
      const qs = this.questsOn(date);
      cells.push({
        label: String(d), hk: this.reg(() => { this._guardUntil = Date.now() + 400; this.setState({ dayKey: k }); }),
        style: 'min-height:92px;display:flex;flex-direction:column;gap:9px;padding:10px;border-radius:13px;background:' +
          (future ? '#0d1015' : 'linear-gradient(165deg,#151820,#101319)') + ';border:1px solid ' + (isToday ? 'var(--acc)' : '#1e2431') +
          ';' + (isToday ? 'box-shadow:0 0 22px -6px var(--acc-glow);' : ''),
        numStyle: 'font-size:12px;font-weight:800;letter-spacing:-.02em;color:' + (isToday ? 'var(--acc-text)' : future ? '#4a5364' : '#8d97ab') + ';',
        dots: qs.map(q => ({ style: 'width:8px;height:8px;border-radius:99px;display:inline-block;' + (dl.includes(q.id) ? 'background:var(--acc);box-shadow:0 0 7px var(--acc-glow);' : 'border:1.5px solid #333c4c;') }))
      });
    }

    const endOffset = (s.today.getDay() + 6) % 7;
    const weeks = [], months = [];
    let heatTotal = 0;
    for (let w = 17; w >= 0; w--) {
      const dayCells = []; let label = '';
      for (let dow = 0; dow < 7; dow++) {
        const off = w * 7 + (endOffset - dow);
        const date = new Date(s.today.getTime() - off * MS);
        const k = key(date);
        const n = off < 0 ? -1 : (s.done[k] || []).length;
        if (dow === 0 && date.getDate() <= 7) label = MON_SHORT[date.getMonth()];
        if (n > 0) heatTotal += n;
        const alpha = n <= 0 ? 0 : Math.min(1, 0.22 + n * 0.2);
        dayCells.push({
          title: n < 0 ? '' : date.getDate() + ' ' + MONTHS_GEN[date.getMonth()] + ' — ' + n + ' квестов',
          style: 'width:15px;height:15px;border-radius:4px;display:block;' + (off < 0 ? 'opacity:0;' : n === 0
            ? 'background:#151a22;border:1px solid #1b202a;'
            : 'background:color-mix(in srgb, var(--acc) ' + Math.round(alpha * 100) + '%, #0f1218);' + (n >= 4 ? 'box-shadow:0 0 8px -1px var(--acc-glow);' : ''))
        });
      }
      weeks.push({ days: dayCells });
      months.push({ name: label, style: 'width:15px;font-size:9px;font-weight:700;color:#5f6879;letter-spacing:.03em' });
    }

    const barData = [];
    for (let i = 13; i >= 0; i--) { const date = new Date(s.today.getTime() - i * MS); barData.push({ date, xp: this.xpOn(key(date)) }); }
    const maxXp = Math.max(40, ...barData.map(b => b.xp));
    const bars = barData.map((b, bi) => {
      const k = key(b.date);
      const showLabel = bi % 2 === 1 || bi === barData.length - 1;
      const ids = s.done[k] || [];
      const isNow = k === tk;
      const parts = CAT_ORDER.map(c => ({ c, sum: ids.reduce((a, id) => { const q = s.quests.find(x => x.id === id); return a + (q && q.cat === c ? q.xp : 0); }, 0) })).filter(p => p.sum > 0);
      return {
        xp: b.xp > 0 ? b.xp : '', label: showLabel ? String(b.date.getDate()) : '',
        labelStyle: 'height:12px;line-height:12px;font-size:10px;font-weight:700;color:' + (isNow ? '#e9ecf2' : '#5f6879') + ';',
        stackStyle: 'width:100%;display:flex;flex-direction:column-reverse;gap:2px;border-radius:8px 8px 4px 4px;overflow:hidden;height:' +
          Math.max(2.5, (b.xp / maxXp) * 100) + '%;transition:height .5s cubic-bezier(.22,1,.36,1);' +
          (b.xp === 0 ? 'background:#1a1f29;' : '') + (isNow ? 'outline:1px solid rgba(233,236,242,.22);outline-offset:2px;' : ''),
        segments: parts.map(p => ({ style: 'display:block;width:100%;flex:' + p.sum + ' 1 0;min-height:4px;background:linear-gradient(180deg,' + CATS[p.c].color + ',' + tint(CATS[p.c].color, 0.55) + ');box-shadow:0 0 16px -6px ' + CATS[p.c].color + ';' }))
      };
    });
    const barsTotal = barData.reduce((a, b) => a + b.xp, 0);
    const trend = barData.map((b, i) => { const win = barData.slice(Math.max(0, i - 2), i + 1); return win.reduce((a, x) => a + x.xp, 0) / win.length; });
    const px = i => (i / (barData.length - 1)) * 100;
    const py = v => 100 - Math.min(100, (v / maxXp) * 100);
    const trendLine = trend.map((v, i) => px(i).toFixed(2) + ',' + py(v).toFixed(2)).join(' ');
    const trendArea = '0,100 ' + trendLine + ' 100,100';
    const trendDots = trend.map((v, i) => ({ style: 'position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:99px;background:#0f1218;border:2px solid #e9ecf2;box-shadow:0 0 10px -1px rgba(233,236,242,.7);left:' + px(i).toFixed(2) + '%;top:' + py(v).toFixed(2) + '%;' }));

    const totalDone = Object.values(s.done).reduce((a, l) => a + l.length, 0);
    const achDefs = [
      ['🌱', 'Первый шаг', 'Выполни первый квест', totalDone >= 1],
      ['🔥', 'Неделя огня', '7 дней серии подряд', st.best >= 7],
      ['🧊', 'Закалённый', '30 дней серии', st.best >= 30],
      ['📚', 'Книжный червь', '50 квестов закрыто', totalDone >= 50],
      ['🏃', 'Марафонец', '100 квестов закрыто', totalDone >= 100],
      ['⚡', 'Уровень 5', 'Дойти до 5 уровня', lvl >= 5],
      ['🛡️', 'Воин', 'Получить ранг Воин', lvl >= 5],
      ['💎', 'Тысячник', '1000 XP всего', this.totalXp() >= 1000],
      ['🎯', 'Идеальный день', 'Все квесты за день', doneToday === list.length && list.length > 0],
      ['👑', 'Легенда', 'Дойти до 12 уровня', lvl >= 12],
      ['🗿', 'Титан', 'Дойти до 16 уровня', lvl >= 16]
    ];
    const achievements = achDefs.map(([icon, title, desc, on]) => ({
      icon, title, desc,
      cardStyle: 'display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:16px;background:' +
        (on ? 'linear-gradient(165deg,#171b24,#11141b)' : '#101319') + ';border:1px solid ' + (on ? 'var(--acc-t45)' : '#1c212b') + ';' +
        (on ? 'box-shadow:0 0 30px -18px var(--acc-glow);' : 'opacity:.55;'),
      iconStyle: 'font-size:28px;line-height:1;' + (on ? 'filter:drop-shadow(0 0 12px var(--acc-glow));' : 'filter:grayscale(1);opacity:.7;'),
      titleStyle: 'font-size:14px;font-weight:800;letter-spacing:-.02em;color:' + (on ? '#e9ecf2' : '#7c8598') + ';',
      descStyle: 'font-size:11px;font-weight:500;line-height:1.45;color:' + (on ? '#8d97ab' : '#5f6879') + ';'
    }));

    const dk = s.dayKey;
    const dayDate = dk ? new Date(dk) : null;
    const dayList = dayDate ? this.questsOn(dayDate) : [];
    const dayDone = dk ? (s.done[dk] || []) : [];

    const segBase = 'flex:1;padding:9px 6px;border-radius:10px;border:1px solid transparent;background:transparent;color:#8d97ab;font-size:11px;font-weight:700;letter-spacing:-.005em;';
    const repeatDefs = [['daily', 'Каждый день'], ['weekdays', 'По дням'], ['everyN', 'Каждые N'], ['once', 'Разово']];

    const headings = { today: 'С возвращением, игрок', calendar: 'Календарь квестов', stats: 'Статистика прогресса', ach: 'Зал достижений' };

      today: doneToday + ' из ' + list.length + ' квестов закрыто · +' + this.xpOn(tk) + ' XP сегодня',

      ach: 'Открывай бейджи, закрывая квесты'
    };

    return {
      navItems, screen: s.screen,
      isToday: s.screen === 'today', isCalendar: s.screen === 'calendar', isStats: s.screen === 'stats', isAch: s.screen === 'ach',
      heading: headings[s.screen],
      dateLabel: WD_FULL[s.today.getDay()][0].toUpperCase() + WD_FULL[s.today.getDay()].slice(1) + ', ' + s.today.getDate() + ' ' + MONTHS_GEN[s.today.getMonth()] + ' · ' + subs[s.screen],

      streakBarStyle: 'height:100%;width:' + Math.min(100, (st.cur / Math.max(st.best, 1)) * 100) + '%;border-radius:99px;background:linear-gradient(90deg,#ff8a3d,#ffc247);box-shadow:0 0 12px rgba(255,138,61,.6);',
      level: lvl, rank: rankFor(lvl), nextLevel: lvl + 1, nextRank: rankFor(lvl + 1),

      rankLadder: RANKS.map(([n, name]) => {

      heroLegend: CAT_ORDER.map(c => ({ name: CATS[c].name, dot: 'width:9px;height:9px;border-radius:3px;display:inline-block;background:' + CATS[c].color + ';box-shadow:0 0 10px -1px ' + tint(CATS[c].color, 0.8) + ';' }))

          name: CATS[c].name, icon: CATS[c].icon, done: dn, total: qs.length,

        };
      }).filter(g => g.total > 0),
      doneToday, countToday: list.length, allDone: list.length > 0 && doneToday === list.length,

      weekdayNames: ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'],
      monthLabel: MONTHS[m.getMonth()] + ' ' + m.getFullYear(),
      monthCells: cells,
      prevHk: this.reg(() => this.setState({ month: new Date(m.getFullYear(), m.getMonth() - 1, 1) })),
      nextHk: this.reg(() => this.setState({ month: new Date(m.getFullYear(), m.getMonth() + 1, 1) })),

      heatWeeks: weeks, heatMonths: months, heatTotal,
      heatLegend: [0, 1, 2, 3, 4].map(n => ({ style: 'width:11px;height:11px;border-radius:3px;display:inline-block;' + (n === 0 ? 'background:#151a22;border:1px solid #1b202a;' : 'background:color-mix(in srgb, var(--acc) ' + Math.round((0.22 + n * 0.2) * 100) + '%, #0f1218);') })),
      bars, barsTotal, trendLine, trendArea, trendDots, barsAvg: Math.round(barsTotal / 14), barsMax: maxXp,

      achievements, achDone: achDefs.filter(a => a[3]).length, achTotal: achDefs.length,

      noopHk: this.reg(() => {}),
      showNew: s.showNew,
      openNewHk: this.reg(() => { this._formTitle = ''; this._focusTitle = true; this._guardUntil = Date.now() + 400; this.setState({ showNew: true, formTitle: '' }); }),
      closeNewHk: this.reg(() => this.setState({ showNew: false })),

      formN: s.formN,
      catOptions: CAT_ORDER.map(c => {
        const col = CATS[c].color, on = s.formCat === c;

            (on ? 'box-shadow:0 0 24px -14px ' + col + ';' : '') };

      xpOptions: XP_OPTS.map(([xp, label]) => ({
        xp, label, hk: this.reg(() => this.setState({ formXp: xp })),

          (s.formXp === xp ? 'var(--acc-t12)' : '#0f1218') + ';border:1px solid ' + (s.formXp === xp ? 'var(--acc-t45)' : '#242a35') +
          ';color:' + (s.formXp === xp ? 'var(--acc-text)' : '#7c8598') + ';' + (s.formXp === xp ? 'box-shadow:0 0 22px -12px var(--acc-glow);' : '') })),
      repeatOptions: repeatDefs.map(([id, label]) => ({ label, hk: this.reg(() => this.setState({ formRepeat: id })), style: segBase + (s.formRepeat === id ? 'background:var(--acc-t12);border-color:var(--acc-t45);color:var(--acc-text);' : '') })),
      showDayPicker: s.formRepeat === 'weekdays', showNPicker: s.formRepeat === 'everyN', showOnceNote: s.formRepeat === 'once',
      dateShort: s.today.getDate() + ' ' + MONTHS_GEN[s.today.getMonth()],
      dayToggles: [1, 2, 3, 4, 5, 6, 0].map(i => ({
        name: WD[i], hk: this.reg(() => this.setState(st2 => ({ formDays: st2.formDays.includes(i) ? st2.formDays.filter(x => x !== i) : [...st2.formDays, i] }))),
        style: 'flex:1;padding:9px 0;border-radius:10px;font-size:11px;font-weight:700;background:' +
          (s.formDays.includes(i) ? 'var(--acc-t12)' : 'transparent') + ';border:1px solid ' + (s.formDays.includes(i) ? 'var(--acc-t45)' : '#242a35') +
          ';color:' + (s.formDays.includes(i) ? 'var(--acc-text)' : '#7c8598') + ';' })),
      incHk: this.reg(() => this.setState(st2 => ({ formN: Math.min(30, st2.formN + 1) }))),
      decHk: this.reg(() => this.setState(st2 => ({ formN: Math.max(2, st2.formN - 1) }))),
      createHk: this.reg(() => {
        const title = (this._formTitle && this._formTitle.trim()) || 'Новый квест';
        const q = { id: s.nextId, title, xp: s.formXp, type: s.formRepeat, days: s.formDays, n: s.formN, start: tk, date: tk, cat: s.formCat };
        this.state.quests = [...s.quests, q]; this.state.nextId = s.nextId + 1; this.state.showNew = false; this.state.formTitle = '';
        this.persist(); this.render();
        this.pushToast('🎯', 'Квест добавлен', title + ' · +' + s.formXp + ' XP');
      }),

      showDay: !!dk, closeDayHk: this.reg(() => this.setState({ dayKey: null })),
      backdropCloseDayHk: this.reg(() => { if (Date.now() < (this._guardUntil || 0)) return; this.setState({ dayKey: null }); }),
      dayTitle: dayDate ? dayDate.getDate() + ' ' + MONTHS_GEN[dayDate.getMonth()] + ' ' + dayDate.getFullYear() : '',
      dayWeekday: dayDate ? WD_FULL[dayDate.getDay()] : '',
      dayQuests: dayList.map(q => mkRow(q, dk, dayDone)),
      dayEmpty: dayList.length === 0, dayXp: dk ? this.xpOn(dk) : 0,

      toasts: s.toasts.map(t => ({ icon: t.icon, title: t.title, sub: t.sub })),
      confetti: s.confetti.map(c => ({ style: 'position:absolute;top:0;left:' + c.left + '%;width:' + c.size + 'px;height:' + c.size * 1.6 + 'px;border-radius:2px;background:' + c.color + ';animation:conf ' + c.dur + 's ease-in ' + c.delay + 's forwards;' })),

      accentIsGold: s.accent === 'gold',
      toggleAccentHk: this.reg(() => { this.state.accent = s.accent === 'gold' ? 'blue' : 'gold'; this.applyAccent(); this.persist(); this.render(); })
    };
  }

  reg(fn){ this._handlers.push(fn); return this._handlers.length - 1; }

    this._handlers = [];
    const v = this.computeVals();
    this.root.innerHTML = this.buildHTML(v);

    if (titleInput) {
      titleInput.oninput = e => { this._formTitle = e.target.value; };
      if (this._focusTitle) { titleInput.focus(); this._focusTitle = false; }
    }
  }

      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px">${v.weekdayNames.map(n => `<div style="text-align:center;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#5f6879">${n}</div>`).join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">${v.monthCells.map(c => `<div ${c.hk>=0?`data-hk="${c.hk}"`:''} style="${c.style}"><div style="${c.numStyle}">${c.label}</div><div style="display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start">${c.dots.map(d => `<i style="${d.style}"></i>`).join('')}</div></div>`).join('')}</div>
    </div>`;

    const statsView = `<div style="display:flex;flex-direction:column;gap:18px">
      <div style="padding:26px;border-radius:18px;background:linear-gradient(170deg,#141821,#0f1218);border:1px solid #242a35">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px">
          <div><h2 style="margin:0;font-size:19px;font-weight:800;letter-spacing:-.038em">Активность</h2><div style="margin-top:6px;font-size:12px;color:#6b7488">Последние 18 недель · ${v.heatTotal} квестов закрыто</div></div>
          <div style="display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;color:#6b7488"><span>меньше</span>${v.heatLegend.map(lg => `<i style="${lg.style}"></i>`).join('')}<span>больше</span></div>
        </div>
        <div style="display:flex;gap:5px">${v.heatWeeks.map(w => `<div style="display:flex;flex-direction:column;gap:5px">${w.days.map(hd => `<i title="${esc(hd.title)}" style="${hd.style}"></i>`).join('')}</div>`).join('')}</div>
        <div style="display:flex;gap:5px;margin-top:10px">${v.heatMonths.map(hm => `<div style="${hm.style}">${hm.name}</div>`).join('')}</div>
      </div>
      <div style="padding:26px;border-radius:18px;background:linear-gradient(170deg,#141821,#0f1218);border:1px solid #242a35">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px">
          <div><h2 style="margin:0;font-size:19px;font-weight:800;letter-spacing:-.038em">XP за 14 дней</h2><div style="margin-top:6px;font-size:12px;color:#6b7488">Всего ${v.barsTotal} XP · в среднем ${v.barsAvg} XP в день</div></div>
          <div style="font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-text)">пик ${v.barsMax} XP</div>
        </div>
        <div style="display:flex;align-items:flex-end;gap:10px;height:206px">${v.bars.map(b => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end">
          <div style="font-size:11px;font-weight:700;color:#8d97ab">${b.xp}</div>
          <div style="${b.stackStyle}">${b.segments.map(sg => `<i style="${sg.style}"></i>`).join('')}</div>
          <div style="font-size:10px;font-weight:600;color:#5f6879">${b.label}</div>
        </div>`).join('')}</div>
      </div>
    </div>`;

    const achView = `<div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px"><h2 style="margin:0;font-size:19px;font-weight:800;letter-spacing:-.038em">Достижения</h2><span style="font-size:12px;font-weight:600;color:#6b7488">${v.achDone} из ${v.achTotal} открыто</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px">${v.achievements.map(a => `<div style="${a.cardStyle}"><div style="${a.iconStyle}">${a.icon}</div><div style="${a.titleStyle}">${esc(a.title)}</div><div style="${a.descStyle}">${esc(a.desc)}</div></div>`).join('')}</div>
    </div>`;

    const newModal = !v.showNew ? '' : `<div data-hk="${v.backdropCloseNewHk}" style="position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(4,5,8,.74);backdrop-filter:blur(7px);animation:fadeIn .18s ease">
      <div data-hk="${v.noopHk}" style="width:520px;max-height:88vh;overflow-y:auto;padding:28px;border-radius:20px;background:linear-gradient(170deg,#171b24,#0f1218);border:1px solid #2a3241;box-shadow:0 44px 96px -34px #000;animation:popIn .22s cubic-bezier(.22,1,.36,1)">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
          <div><div style="font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc-text)">Новый квест</div><h3 style="margin:8px 0 0;font-size:24px;font-weight:800;letter-spacing:-.045em">Что берём в работу?</h3></div>
          <button type="button" data-hk="${v.closeNewHk}" style="width:32px;height:32px;flex:0 0 32px;border-radius:10px;border:1px solid #242a35;background:transparent;color:#7c8598">✕</button>
        </div>
        <div style="margin-top:24px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#6b7488">Название</div>
        <input id="questTitleInput" value="${esc(this._formTitle)}" placeholder="Например: 30 минут бега" style="width:100%;margin-top:9px;padding:13px 14px;border-radius:12px;border:1px solid #242a35;background:#0f1218;color:#e9ecf2;font-size:14px;font-weight:500;outline:none" />
        <div style="margin-top:22px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#6b7488">Ветка</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:9px">${v.catOptions.map(c => `<button type="button" data-hk="${c.hk}" style="${c.style}"><span style="font-size:16px">${c.icon}</span><span style="font-size:11px;font-weight:800;letter-spacing:.03em">${esc(c.name)}</span></button>`).join('')}</div>
        <div style="margin-top:22px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#6b7488">Сложность</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:9px">${v.xpOptions.map(x => `<button type="button" data-hk="${x.hk}" style="${x.style}"><div style="font-size:19px;font-weight:900;letter-spacing:-.05em">${x.xp}</div><div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7">${x.label}</div></button>`).join('')}</div>
        <div style="margin-top:22px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#6b7488">Повтор</div>
        <div style="display:flex;gap:4px;margin-top:9px;padding:4px;border-radius:13px;background:#0f1218;border:1px solid #242a35">${v.repeatOptions.map(r => `<button type="button" data-hk="${r.hk}" style="${r.style}">${r.label}</button>`).join('')}</div>
        ${v.showDayPicker ? `<div style="margin-top:16px;padding:16px;border-radius:14px;background:#0f1218;border:1px solid #1e2431;animation:fadeIn .2s ease">
          <div style="font-size:11px;font-weight:600;color:#7c8598;margin-bottom:11px">В какие дни недели?</div>
          <div style="display:flex;gap:7px">${v.dayToggles.map(dt => `<button type="button" data-hk="${dt.hk}" style="${dt.style}">${dt.name}</button>`).join('')}</div>
        </div>` : ''}
        ${v.showNPicker ? `<div style="margin-top:16px;padding:16px;border-radius:14px;background:#0f1218;border:1px solid #1e2431;animation:fadeIn .2s ease">
          <div style="font-size:11px;font-weight:600;color:#7c8598;margin-bottom:11px">Интервал в днях</div>
          <div style="display:flex;align-items:center;gap:12px">
            <button type="button" data-hk="${v.decHk}" style="width:34px;height:34px;border-radius:10px;border:1px solid #242a35;background:#12151c;color:#9aa4b8;font-size:16px">−</button>
            <div style="min-width:56px;text-align:center;font-size:24px;font-weight:900;letter-spacing:-.05em">${v.formN}</div>
            <button type="button" data-hk="${v.incHk}" style="width:34px;height:34px;border-radius:10px;border:1px solid #242a35;background:#12151c;color:#9aa4b8;font-size:16px">+</button>
            <span style="font-size:12px;color:#6b7488">каждые ${v.formN} дн.</span>
          </div>
        </div>` : ''}
        ${v.showOnceNote ? `<div style="margin-top:16px;padding:16px;border-radius:14px;background:#0f1218;border:1px solid #1e2431;font-size:12px;color:#7c8598;animation:fadeIn .2s ease">Разовый квест на ${v.dateShort}. Пропадёт из списка после выполнения.</div>` : ''}
        <div style="display:flex;gap:10px;margin-top:26px">
          <button type="button" data-hk="${v.closeNewHk}" style="flex:0 0 auto;padding:13px 20px;border-radius:12px;border:1px solid #242a35;background:transparent;color:#9aa4b8;font-size:13px;font-weight:700">Отмена</button>
          <button type="button" data-hk="${v.createHk}" style="flex:1;padding:13px 20px;border-radius:12px;border:1px solid var(--acc-t45);background:linear-gradient(180deg,var(--acc),var(--acc-deep));color:#f4f7ff;font-size:13px;font-weight:800;letter-spacing:-.01em;box-shadow:0 10px 28px -12px var(--acc-glow)">Создать квест</button>
        </div>
      </div>
    </div>`;

    const dayModal = !v.showDay ? '' : `<div data-hk="${v.backdropCloseDayHk}" style="position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(4,5,8,.74);backdrop-filter:blur(7px);animation:fadeIn .18s ease">
      <div data-hk="${v.noopHk}" style="width:460px;max-height:82vh;overflow-y:auto;padding:26px;border-radius:20px;background:linear-gradient(170deg,#171b24,#0f1218);border:1px solid #2a3241;box-shadow:0 44px 96px -34px #000;animation:popIn .22s cubic-bezier(.22,1,.36,1)">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
          <div><div style="font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc-text)">${esc(v.dayWeekday)}</div><h3 style="margin:8px 0 0;font-size:22px;font-weight:800;letter-spacing:-.045em">${v.dayTitle}</h3></div>
          <button type="button" data-hk="${v.closeDayHk}" style="width:32px;height:32px;flex:0 0 32px;border-radius:10px;border:1px solid #242a35;background:transparent;color:#7c8598">✕</button>
        </div>
        <div style="margin-top:20px;display:flex;flex-direction:column;gap:9px">${v.dayQuests.map(q => `<div class="qrow" data-hk="${q.hk}" style="${q.rowStyle}"><div style="${q.boxStyle}">${q.tick}</div><div style="flex:1;min-width:0"><div style="${q.titleStyle}">${esc(q.title)}</div></div><span style="${q.xpStyle}">+${q.xp} XP</span></div>`).join('')}</div>
        ${v.dayEmpty ? `<div style="margin-top:18px;padding:18px;border-radius:14px;border:1px dashed #242a35;text-align:center;font-size:12px;color:#6b7488">На этот день квестов нет</div>` : ''}
        <div style="margin-top:20px;padding-top:16px;border-top:1px solid #1e2431;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#7c8598"><span>Заработано</span><span style="color:var(--acc-text)">${v.dayXp} XP</span></div>
      </div>
    </div>`;

    const toasts = v.toasts.length === 0 ? '' : `<div style="position:fixed;bottom:28px;right:28px;z-index:70;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none">
      ${v.toasts.map(t => `<div style="display:flex;align-items:center;gap:13px;padding:14px 18px;border-radius:14px;background:linear-gradient(165deg,#1a1f2a,#11141b);border:1px solid var(--acc-t45);box-shadow:0 20px 44px -22px #000,0 0 30px -18px var(--acc-glow);animation:toastIn .28s cubic-bezier(.22,1,.36,1);min-width:230px">
        <span style="font-size:19px">${t.icon}</span><div><div style="font-size:14px;font-weight:800;letter-spacing:-.02em;color:var(--acc-text)">${esc(t.title)}</div><div style="margin-top:3px;font-size:11px;font-weight:600;color:#8d97ab">${esc(t.sub)}</div></div>
      </div>`).join('')}
    </div>`;

    const confetti = v.confetti.length === 0 ? '' : `<div style="position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden">${v.confetti.map(c => `<i style="${c.style}"></i>`).join('')}</div>`;

    return `<div style="display:flex;height:100vh;background:#08080a;position:relative;overflow:hidden;font-family:'Inter',system-ui,sans-serif">
      <div style="position:absolute;top:-380px;left:-240px;width:900px;height:900px;pointer-events:none;background:radial-gradient(closest-side,var(--acc-t22),transparent);filter:blur(26px);animation:breathe 9s ease-in-out infinite"></div>
      <div style="position:absolute;bottom:-460px;right:-280px;width:1040px;height:1040px;pointer-events:none;background:radial-gradient(closest-side,var(--acc-t12),transparent);filter:blur(34px);animation:breathe 13s ease-in-out infinite"></div>
      <aside style="position:relative;z-index:2;width:236px;flex:0 0 236px;display:flex;flex-direction:column;gap:8px;padding:26px 18px 22px;background:linear-gradient(180deg,rgba(21,24,32,.88),rgba(9,10,14,.88));border-right:1px solid #1a1e27;backdrop-filter:blur(14px)">
        <div style="display:flex;align-items:center;gap:9px;padding:0 8px 24px"><span style="font-size:20px;filter:drop-shadow(0 0 10px var(--acc-glow))">⚡</span><span style="font-size:19px;font-weight:900;letter-spacing:-.045em">LVL UP</span></div>
        <nav style="display:flex;flex-direction:column;gap:4px">${v.navItems.map(n => `<button type="button" data-hk="${n.hk}" style="${n.style}"><span style="width:18px;display:inline-flex;justify-content:center;font-size:14px">${n.icon}</span><span>${n.label}</span></button>`).join('')}</nav>
        <div style="flex:1"></div>
        <button type="button" data-hk="${v.toggleAccentHk}" style="text-align:left;padding:9px 12px;border-radius:11px;border:1px solid #242a35;background:transparent;color:#6b7488;font-size:11px;font-weight:700">Тема: ${v.accentIsGold ? 'Золото ✨' : 'Синяя ⚡'}</button>
        <div style="padding:16px;border-radius:14px;background:linear-gradient(160deg,#151820,#101319);border:1px solid #242a35;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)">
          <div style="font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#6b7488">Серия</div>
          <div style="display:flex;align-items:baseline;gap:8px;margin-top:9px"><span style="font-size:21px;filter:drop-shadow(0 0 12px rgba(255,138,61,.6))">🔥</span><span style="font-size:34px;font-weight:900;letter-spacing:-.055em;line-height:1">${v.streak}</span><span style="font-size:12px;font-weight:600;color:#7c8598">дней</span></div>
          <div style="margin-top:13px;height:5px;border-radius:99px;background:#1d222c;overflow:hidden"><div style="${v.streakBarStyle}"></div></div>
          <div style="margin-top:10px;font-size:11px;color:#6b7488;line-height:1.4">${esc(v.streakNote)}</div>
        </div>
      </aside>
      <main style="position:relative;z-index:2;flex:1;min-width:0;overflow-y:auto;padding:34px 44px 60px">
        <header style="display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:26px">
          <div><h1 style="margin:0;font-size:34px;font-weight:800;letter-spacing:-.048em;line-height:1.05">${esc(v.heading)}</h1><div style="margin-top:8px;font-size:13px;font-weight:500;color:#7c8598">${esc(v.dateLabel)}</div></div>
          <button type="button" data-hk="${v.openNewHk}" style="display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--acc-t45);background:linear-gradient(180deg,var(--acc),var(--acc-deep));color:#f4f7ff;font-size:13px;font-weight:700;letter-spacing:-.01em;box-shadow:0 10px 28px -12px var(--acc-glow)"><span style="font-size:15px;line-height:1">+</span><span>Новый квест</span></button>
        </header>
        ${v.isToday ? todayView : ''}
        ${v.isCalendar ? calendarView : ''}
        ${v.isStats ? statsView : ''}
        ${v.isAch ? achView : ''}
      </main>
      ${newModal}
      ${dayModal}
      ${toasts}
      ${confetti}
    </div>`;
  }
}

window.addEventListener('DOMContentLoaded', () => { window.__app = new App(); });
})();
</script>
</body>
</html>
